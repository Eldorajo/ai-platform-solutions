# Runs typecheck and every package's tests on each push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs TypeScript directly, so there is no build step.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Demos run cleanly
        run: |
          npm run demo -w agent-eval-harness > /dev/null
          npm run demo -w rag-retrieval-audit > /dev/null
